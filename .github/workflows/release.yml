# Builds the native Node bindings on every platform and the WebAssembly engine,
# and publishes every npm package: the platform binaries, `inkoxide`,
# `@inkoxide/schema` and `@inkoxide/wasm`, then `@inkoxide/style`,
# `@inkoxide/tailwind`, `@inkoxide/react` and `@inkoxide/render`. Versions
# already on the registry are skipped. npm trusts this workflow (trusted
# publishing), so no token is stored and every package gets provenance.
# Finally it tags the commit and creates the GitHub release from the newest
# CHANGELOG.md section.
# Manual dispatch only; it runs no tests. It starts by checking that the ci
# workflow passed for the commit, and stops if not (a dry run only warns).
#
# The platforms are packages/inkoxide/package.json's napi.targets (see
# scripts/platforms.mjs). The build jobs list the targets they compile, each
# with its own toolchains; scripts/npm-release.mjs refuses to publish when a
# platform's binary is missing.
name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Pass --dry-run to npm publish (nothing is uploaded)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: '0'

jobs:
  ci-passed:
    name: ci passed for this commit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # list the ci workflow's runs
    steps:
      - name: Require a successful ci run for this commit
        # A dry run may come from a commit ci has not checked; it only warns.
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          runs="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)"
          if [[ "$runs" -gt 0 ]]; then
            echo "ci passed for $GITHUB_SHA"
          elif [[ "$DRY_RUN" == "true" ]]; then
            echo "::warning::no successful ci run for $GITHUB_SHA; a real release would stop here"
          else
            echo "::error::no successful ci run for $GITHUB_SHA; release a commit that passed ci"
            exit 1
          fi

  linux:
    name: build linux (x64 gnu, x64 musl, arm64 gnu)
    needs: ci-passed
    # Older glibc (2.35) than the latest image, for wider compatibility.
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      # musl: a cdylib needs a dynamic C runtime. musl-gcc links against
      # musl's libc; its specs hide the host library directory, so
      # libgcc_s (for unwinding) is exposed from a directory of its own.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CC_x86_64_unknown_linux_musl: musl-gcc
      # arm64: linker and C compiler from gcc-aarch64-linux-gnu. No crate in
      # the inkoxide-node graph compiles C today; CC_* covers a future one.
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
      CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install cross toolchains
        run: |
          sudo apt-get update -q
          # libc6-dev-arm64-cross (crti.o, libdl) is only a recommendation of
          # gcc-aarch64-linux-gnu, so --no-install-recommends needs it named.
          sudo apt-get install -y -q --no-install-recommends musl-tools gcc-aarch64-linux-gnu \
            libc6-dev-arm64-cross
          mkdir -p "$RUNNER_TEMP/musl-libgcc"
          ln -sf "$(gcc -print-file-name=libgcc_s.so.1)" "$RUNNER_TEMP/musl-libgcc/libgcc_s.so.1"
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=-crt-static -C link-arg=-L$RUNNER_TEMP/musl-libgcc" >> "$GITHUB_ENV"
      - name: Install Rust toolchain and targets
        # Version and components come from rust-toolchain.toml (rustup would
        # add the listed components anyway; they are not run).
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt,clippy
          targets: x86_64-unknown-linux-gnu x86_64-unknown-linux-musl aarch64-unknown-linux-gnu
      - name: Build
        run: |
          mkdir -p out
          build() {
            cargo build -p inkoxide-node --release --locked --target "$1"
            cp "target/$1/release/libinkoxide_node.so" "out/inkoxide.$2.node"
          }
          build x86_64-unknown-linux-gnu linux-x64-gnu
          build x86_64-unknown-linux-musl linux-x64-musl
          build aarch64-unknown-linux-gnu linux-arm64-gnu
          # The musl binary must not depend on glibc.
          if readelf -d out/inkoxide.linux-x64-musl.node | grep -q 'libc\.so\.6'; then
            echo "musl binary links glibc" >&2; exit 1
          fi
          file out/*.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-linux
          path: out/*.node
          if-no-files-found: error
          retention-days: 3

  macos:
    name: build macos (arm64, x64)
    needs: ci-passed
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and targets
        # Version and components come from rust-toolchain.toml (rustup would
        # add the listed components anyway; they are not run).
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt,clippy
          targets: aarch64-apple-darwin x86_64-apple-darwin
      - name: Build
        run: |
          mkdir -p out
          build() {
            cargo build -p inkoxide-node --release --locked --target "$1"
            cp "target/$1/release/libinkoxide_node.dylib" "out/inkoxide.$2.node"
          }
          build aarch64-apple-darwin darwin-arm64
          build x86_64-apple-darwin darwin-x64
          file out/*.node
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-macos
          path: out/*.node
          if-no-files-found: error
          retention-days: 3

  windows:
    name: build windows (x64 msvc)
    needs: ci-passed
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and target
        # Version and components come from rust-toolchain.toml (rustup would
        # add the listed components anyway; they are not run).
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt,clippy
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: |
          mkdir -p out
          cargo build -p inkoxide-node --release --locked --target x86_64-pc-windows-msvc
          cp target/x86_64-pc-windows-msvc/release/inkoxide_node.dll out/inkoxide.win32-x64-msvc.node
          ls -l out
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-windows
          path: out/*.node
          if-no-files-found: error
          retention-days: 3

  wasm:
    name: build wasm
    needs: ci-passed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust toolchain and target
        uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown
      - name: Build
        # As the ci workflow builds the module it tests: no wasm-opt, which made it no smaller
        # with brotli and no faster.
        run: |
          scripts/build-wasm.sh
          node scripts/wasm-size.mjs
          mkdir -p out
          cp packages/wasm/inkoxide.wasm out/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bindings-wasm
          path: out/inkoxide.wasm
          if-no-files-found: error
          retention-days: 3

  publish:
    name: publish to npm
    needs: [linux, macos, windows, wasm]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # A real release runs in the `release` environment: its deployment branch rule admits only
    # main, and npm's trusted publisher for each package names that environment, so a token
    # minted outside it cannot publish. A dry run (an empty name: no environment) may come from
    # any branch and uploads nothing.
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release only from main
        # A dry run may come from any branch.
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::releases are published from main, not $GITHUB_REF"
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.14.1'
          package-manager-cache: false
      - name: Install npm and pnpm
        # Trusted publishing needs npm 11.5.1 or later; pnpm's version comes from package.json.
        run: |
          npm install --global npm@11.18.0
          corepack enable
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bindings-*
          path: bindings
          merge-multiple: true
      - name: Publish the engine packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          ls -l bindings
          flags=(--publish)
          [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)
          node scripts/npm-release.mjs bindings "$RUNNER_TEMP/npm-staging" "${flags[@]}"
      - name: Install dependencies
        # No install scripts in the job that can mint a publishing token. Staging needs only
        # TypeScript's tsc, which has none; the native bindings were built by the jobs above.
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Publish the React packages
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flags=()
          [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)
          scripts/release/publish.sh ${flags[@]+"${flags[@]}"}

  github-release:
    name: tag and GitHub release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # the tag and the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Release only from main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        run: |
          echo "::error::releases are tagged on main, not $GITHUB_REF"
          exit 1
      - name: Create the release from the newest CHANGELOG.md section
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=(--target "$GITHUB_SHA")
          [[ "$DRY_RUN" == "true" ]] && flags+=(--dry-run)
          node scripts/release/github-release.mjs "${flags[@]}"
