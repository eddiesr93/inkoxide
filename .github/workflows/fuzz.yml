# Fuzzes the engine every night, an hour per target, each corpus carried over from the night
# before (see docs/TESTING.md). A crash, a hang or running out of memory is a security issue
# (SECURITY.md), and the logs and artifacts of this repository's runs are public, so a run with
# findings fails without showing them: its artifacts hold them sealed to the maintainers' key,
# and scripts/fuzz-findings.sh open RUN_ID decrypts them.
name: fuzz

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: Seconds per target
        default: '3600'

permissions:
  contents: read

concurrency:
  group: fuzz
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  # cargo-fuzz needs nightly; a dated one keeps the runs comparable.
  FUZZ_TOOLCHAIN: nightly-2026-10-11

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        target: [render_tree, render_json, render_svg, render_svg_tree, register_font]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # The pinned stable of rust-toolchain.toml (what rustc means here), and the nightly.
        uses: ./.github/actions/install-rust
      - name: Install nightly
        run: rustup toolchain install "$FUZZ_TOOLCHAIN" --profile minimal --no-self-update
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: fuzz -> target
          shared-key: fuzz
          save-if: ${{ matrix.target == 'render_tree' }}
      - name: Install cargo-fuzz
        run: command -v cargo-fuzz || cargo install cargo-fuzz --version 0.13.2 --locked
      - name: Restore the corpus
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-
      - name: Fuzz
        id: fuzz
        env:
          TARGET: ${{ matrix.target }}
          FUZZ_SECONDS: ${{ inputs.seconds || '3600' }}
        # fuzz.sh exits 1 on findings, and 2 when the targets do not build: only findings are sealed.
        run: |
          status=0
          scripts/fuzz.sh "$FUZZ_SECONDS" "$TARGET" || status=$?
          if [[ $status -eq 1 ]]; then echo "findings=true" >>"$GITHUB_OUTPUT"; fi
          exit "$status"
      - name: Save the corpus
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
      - name: Seal the findings
        if: ${{ failure() && steps.fuzz.outputs.findings == 'true' }}
        run: |
          scripts/fuzz-findings.sh seal sealed
          echo "Findings sealed: decrypt them with \`scripts/fuzz-findings.sh open $GITHUB_RUN_ID\`." >>"$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ failure() && steps.fuzz.outputs.findings == 'true' }}
        with:
          name: fuzz-findings-${{ matrix.target }}
          path: sealed
          retention-days: 30
          if-no-files-found: error
