# Runs the Node binding tests on Windows, against the binary built by a
# release run. Manual dispatch only; it builds nothing.
name: test-windows

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: ID of the release run whose bindings-windows artifact to test
        type: string
        required: true

permissions:
  contents: read
  actions: read # download an artifact from another run

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test win32-x64-msvc
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bindings-windows
          path: packages/inkoxide
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - name: Node binding tests
        working-directory: packages/inkoxide
        run: |
          ls -l *.node
          node -p "process.platform + '-' + process.arch + ' ' + JSON.stringify(require('./index.js').version())"
          node --test --test-reporter=tap test/*.test.js test/*.test.mjs
