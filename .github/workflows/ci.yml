# Checks every pull request and every push to main (cargo-deny runs in deny.yml). scripts/ci.sh
# runs the same checks, and the slower ones (visual regression, fuzzing), locally.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        # The version and components come from rust-toolchain.toml.
        uses: ./.github/actions/install-rust
        with:
          components: rustfmt,clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            fuzz -> target
      - name: Install qpdf and pdftotext
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qpdf poppler-utils
      - name: Install veraPDF
        # The PDF/A outputs of the fixture tests pass veraPDF (VERAPDF). The installer runs on the
        # runner's Java.
        env:
          VERAPDF_VERSION: 1.30.3
          VERAPDF_SHA256: b512bf24945503a33fc10738ecffc1f2dccaaf8593a448e94ee9ac86a9559a59
        run: |
          dir=$RUNNER_TEMP/verapdf
          curl -fsSL -o "$RUNNER_TEMP/verapdf.zip" \
            "https://software.verapdf.org/releases/${VERAPDF_VERSION%.*}/verapdf-greenfield-$VERAPDF_VERSION-installer.zip"
          echo "$VERAPDF_SHA256  $RUNNER_TEMP/verapdf.zip" | sha256sum --check --quiet
          unzip -q "$RUNNER_TEMP/verapdf.zip" -d "$RUNNER_TEMP"
          java -DINSTALL_PATH="$dir" \
            -jar "$RUNNER_TEMP/verapdf-greenfield-$VERAPDF_VERSION/verapdf-izpack-installer-$VERAPDF_VERSION.jar" \
            -options-system
          "$dir/verapdf" --version
          echo "VERAPDF=$dir/verapdf" >>"$GITHUB_ENV"
      - name: Format
        run: |
          cargo fmt --all -- --check
          cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - name: Clippy
        # The fuzz crate is its own workspace; this also checks that it builds against the engine.
        run: |
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test
        run: |
          cargo test --workspace --locked
          cargo test --manifest-path fuzz/Cargo.toml --lib --locked

  wasm:
    name: WebAssembly
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install pnpm
        # The version comes from packageManager in package.json.
        run: corepack enable
      - name: Engine without MessagePack and embedded hyphenation patterns
        # As the WebAssembly build has it.
        run: |
          cargo test -p inkoxide --no-default-features --locked --test fixtures msgpack
          cargo test -p inkoxide --no-default-features --locked --test builtin_hyphenation
      - name: Build the WebAssembly engine
        run: scripts/build-wasm.sh
      - name: Size
        run: node scripts/wasm-size.mjs
      - name: Build the native binding
        # What the parity check compares against.
        run: scripts/build-node.sh --debug
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Binding tests
        # The tests of packages/inkoxide, against @inkoxide/wasm.
        working-directory: packages/wasm
        run: pnpm test
      - name: Parity with the native build
        # Fixtures, fuzz seeds and documents at the limits (scripts/wasm-parity.mjs).
        run: node scripts/wasm-parity.mjs
      - name: Install the browsers
        working-directory: examples/browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit
      - name: Browser tests
        # examples/browser, built with Vite: a render in a worker, in each browser, gives the bytes
        # Node gives, under a strict Content Security Policy and without cross-origin isolation.
        working-directory: examples/browser
        run: pnpm test

  schema:
    name: Schema
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install jsonschema
        run: python -m pip install --quiet jsonschema==4.26.0
      - name: Fixtures and examples conform to the schema
        run: python scripts/check-schema.py
      - name: Lockstep package versions
        run: python scripts/check-versions.py

  node:
    name: Node packages
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: ./.github/actions/install-rust
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.22.0'
          package-manager-cache: false
      - name: Install pnpm
        # The version comes from packageManager in package.json.
        run: corepack enable
      - name: Build the native binding
        run: scripts/build-node.sh --debug
      - name: Build the WebAssembly engine
        # For the tests of @inkoxide/render/browser.
        run: scripts/build-wasm.sh
      - name: Install dependencies
        # Before the binding tests: schema-parity.test.js imports ajv.
        run: pnpm install --frozen-lockfile
      - name: Binding tests
        working-directory: packages/inkoxide
        run: node --test test/*.test.js
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Format
        run: pnpm format:check
      - name: Test
        run: pnpm test
        env:
          NODE_ENV: test
      - name: Generated files are up to date
        run: scripts/check-generated.sh
