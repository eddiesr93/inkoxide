# Fuzz targets (cargo-fuzz, nightly). Not a workspace member: libFuzzer
# needs sanitizer flags the rest of the build must not see. See
# docs/TESTING.md.
[package]
name = "inkoxide-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
inkoxide = { path = "../crates/core" }
libfuzzer-sys = "=0.4.12"
serde_json = "=1.0.151"
rmp-serde = "=1.3.1"

[[bin]]
name = "render_json"
path = "fuzz_targets/render_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_tree"
path = "fuzz_targets/render_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_svg"
path = "fuzz_targets/render_svg.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render_svg_tree"
path = "fuzz_targets/render_svg_tree.rs"
test = false
doc = false
bench = false

[[bin]]
name = "register_font"
path = "fuzz_targets/register_font.rs"
test = false
doc = false
bench = false

# The workspace's lints (Cargo.toml), copied: this crate is its own
# workspace.
[lints.rust]
missing_debug_implementations = "warn"

# Pedantic by default; the allowed lints below are noise for this code
# base: geometry is f32 throughout, with casts that are checked or bounded
# by validation, and exact float comparisons are deliberate (layout must
# be deterministic, not approximately equal).
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
implicit_hasher = "allow"

[workspace]
members = ["."]

[profile.release]
debug = 1
panic = "unwind"

# `cargo run --bin repro -- tree <file>`: prints the generated document
# for a `render_tree` input and runs the oracle on it, outside libFuzzer.
[[bin]]
name = "repro"
path = "src/bin/repro.rs"
test = false
doc = false
bench = false
