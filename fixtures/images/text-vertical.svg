<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" font-family="VertTest" font-size="22">
  <rect x="0.5" y="0.5" width="399" height="319" rx="8" fill="#fbfbfd" stroke="#c9ccd6"/>
  <text x="20" y="30" font-family="Inter" font-size="18" font-weight="bold" fill="#14287a">Vertical text</text>

  <g stroke="#d5d8e0">
    <line x1="40" y1="50" x2="40" y2="300"/>
    <line x1="90" y1="50" x2="90" y2="300"/>
