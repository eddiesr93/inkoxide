[package]
name = "inkoxide-cli"
description = "Command-line front end for the Inkoxide PDF engine."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["pdf", "typesetting", "layout", "document", "cli"]
categories = ["command-line-utilities", "text-processing"]
include = ["src/**", "README.md", "LICENSE"]

[[bin]]
name = "inkoxide"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
inkoxide = { workspace = true, features = ["msgpack", "embedded-hyphenation"] }
clap.workspace = true
serde_json.workspace = true
