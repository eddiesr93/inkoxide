[package]
name = "inkoxide"
description = "Native PDF layout and rendering engine: declarative document tree in, PDF bytes out."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_path_to_error.workspace = true
thiserror.workspace = true
tracing.workspace = true
pdf-writer.workspace = true
taffy.workspace = true
rustybuzz.workspace = true
ttf-parser.workspace = true
unicode-linebreak.workspace = true
unicode-bidi.workspace = true
unicode-properties.workspace = true
flate2.workspace = true
image.workspace = true
xxhash-rust.workspace = true
aes.workspace = true
sha2.workspace = true
rayon.workspace = true
subsetter.workspace = true
usvg.workspace = true
simplecss.workspace = true
svgtypes.workspace = true
data-url.workspace = true
rmp-serde = { workspace = true, optional = true }
wuff.workspace = true

[features]
default = ["msgpack", "embedded-hyphenation"]
# The built-in hyphenation patterns in the binary (1.2 MB). Without it,
# `HyphenationStore::register_builtin` gives them at run time.
embedded-hyphenation = []
# `InputFormat::MessagePack`. Without it, MessagePack input is a parse error.
msgpack = ["dep:rmp-serde"]

[dev-dependencies]
criterion.workspace = true
# The matching of `text/builtin.rs` is tested against it.
hypher.workspace = true
rmp-serde.workspace = true

[[bench]]
name = "render"
harness = false
