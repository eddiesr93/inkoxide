# Strings and streams reach the PDF only through `src/pdf/out.rs`, which
# encrypts them when the file is encrypted. Content streams may hold
# `Str`s: the whole stream is encrypted.
disallowed-types = [
  { path = "pdf_writer::TextStr", reason = "write strings through pdf::out::Out::text" },
]
disallowed-methods = [
  { path = "pdf_writer::TextStr", reason = "write strings through pdf::out::Out::text" },
  { path = "pdf_writer::Chunk::stream", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::image_xobject", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::form_xobject", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::tiling_pattern", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::cmap", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::metadata", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::icc_profile", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::embedded_file", reason = "write streams through pdf::out::Out" },
  { path = "pdf_writer::Chunk::stream_shading", reason = "write streams through pdf::out::Out" },
]
