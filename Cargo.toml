[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/node"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/eddiesr93/inkoxide"

# Exact pins (§3): upgrades are deliberate PRs.
[workspace.dependencies]
inkoxide = { path = "crates/core", version = "=0.1.0" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
rmp-serde = "=1.3.1"
thiserror = "=2.0.21"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
pdf-writer = "=0.15.0"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree", "content_size"] }
rustybuzz = "=0.20.1"
ttf-parser = "=0.25.1"
unicode-linebreak = "=0.1.5"
hypher = "=0.1.8"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
rayon = "=1.12.0"
subsetter = { version = "=0.2.6", default-features = false }
usvg = { version = "=0.48.1", default-features = false }
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
napi = { version = "=3.14.2", default-features = false, features = ["napi6"] }
napi-derive = "=3.6.12"
napi-build = "=2.6.0"
clap = { version = "=4.6.7", features = ["derive"] }
insta = "=1.49.0"
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

[profile.bench]
inherits = "release"
debug = true
