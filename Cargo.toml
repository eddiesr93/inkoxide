[workspace]
resolver = "2"
members = ["crates/core", "crates/cli", "crates/node", "crates/binding", "crates/wasm"]

[workspace.package]
version = "0.9.1"
edition = "2021"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/eddiesr93/inkoxide"
homepage = "https://inkoxide.dev"

# Exact pins: upgrades are deliberate PRs.
[workspace.dependencies]
# Without its default features, so that the WebAssembly binding can leave
# MessagePack out: the other members turn `msgpack` on.
inkoxide = { path = "crates/core", version = "=0.9.1", default-features = false }
inkoxide-binding = { path = "crates/binding" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
rmp-serde = "=1.3.1"
thiserror = "=2.0.21"
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
pdf-writer = "=0.15.0"
taffy = { version = "=0.14.0", default-features = false, features = ["std", "flexbox", "grid", "taffy_tree", "content_size"] }
rustybuzz = "=0.20.1"
ttf-parser = "=0.25.1"
unicode-linebreak = "=0.1.5"
unicode-properties = { version = "=0.1.4", default-features = false, features = ["emoji"] }
unicode-bidi = { version = "=0.3.18", default-features = false, features = ["hardcoded-data", "std"] }
hypher = "=0.1.8"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
xxhash-rust = { version = "=0.8.19", features = ["xxh3"] }
aes = "=0.9.3"
sha2 = { version = "=0.11.1", default-features = false }
rayon = "=1.12.0"
# `variable-fonts` is its instancer, which embeds variable fonts as static instances.
subsetter = { version = "=0.2.6", default-features = false, features = ["variable-fonts"] }
usvg = { version = "=0.48.1", default-features = false }
# The versions usvg uses: SVG text resolves CSS and values exactly as usvg does.
simplecss = "=0.2.2"
svgtypes = "=0.16.1"
data-url = "=0.3.2"
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
wuff = { version = "=0.2.9", default-features = false, features = ["brotli"] }
napi = { version = "=3.14.2", default-features = false, features = ["napi6"] }
napi-derive = "=3.6.12"
napi-build = "=2.6.0"
clap = { version = "=4.6.7", features = ["derive"] }
criterion = { version = "=0.8.2", default-features = false, features = ["cargo_bench_support"] }

[workspace.lints.rust]
missing_debug_implementations = "warn"

# Pedantic by default; the allowed lints below are noise for this code
# base: geometry is f32 throughout, with casts that are checked or bounded
# by validation, and exact float comparisons are deliberate (layout must
# be deterministic, not approximately equal).
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
float_cmp = "allow"
many_single_char_names = "allow"
too_many_lines = "allow"
must_use_candidate = "allow"
module_name_repetitions = "allow"
similar_names = "allow"
struct_excessive_bools = "allow"
struct_field_names = "allow"
implicit_hasher = "allow"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# The WebAssembly module (scripts/build-wasm.sh): the standard library of
# wasm32-unknown-unknown aborts on a panic anyway.
[profile.wasm]
inherits = "release"
panic = "abort"
strip = true

[profile.bench]
inherits = "release"
debug = true
