# cargo-deny: licences, advisories, bans. Run via scripts/ci.sh.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained (not vulnerable) shaping/parsing crates, isolated behind the
# TextShaper trait and the fonts module. Both are replaced together by harfrust and read-fonts.
ignore = [
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz unmaintained; only text/prepare.rs uses it; harfrust migration" },
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser unmaintained; only fonts/ uses it; read-fonts migration" },
]

[licenses]
version = 2
confidence-threshold = 0.9
unused-allowed-license = "allow"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "Unicode-3.0",
  # Boost: permissive, OSI-approved (xxhash-rust).
  "BSL-1.0",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
# Kept out of the dependency tree on purpose. Open an issue before
# adding one.
deny = [
  { crate = "printpdf" },
  { crate = "lopdf" },
  { crate = "genpdf" },
  { crate = "krilla" },
  { crate = "parley" },
  { crate = "hyphenation" },
  { crate = "rkyv" },
  { crate = "pdfium-render" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
